# Themes & Appearance
include gruvbox-material.conf
# include nordic.conf  # Uncomment for "nordic" theme

# Font Settings
font_family               SFMono Nerd Font
fallback_font_family      JetBrainsMono Nerd Font
bold_font        auto
italic_font      auto
bold_italic_font auto
font_size        12.0
adjust_line_height 110%
adjust_column_width 102%

# Window Settings
hide_window_decorations yes
window_padding_width 10
background_opacity 0.90
background_blur 5

# Disable closing prompt
confirm_os_window_close 0
